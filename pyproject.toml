[project]
name = "autopartselector"
version = "0.1.0"
description = "Auto-pick JLCPCB parts + footprints for passives in KiCad schematics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autopartselector = "autopartselector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
